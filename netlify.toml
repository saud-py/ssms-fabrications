[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.css"
  [headers.values]
    # Short cache so site updates reach returning visitors quickly
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    # Short cache so site updates reach returning visitors quickly
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# The thank-you page should not show in Google search results
[[headers]]
  for = "/success.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Form handling
[[redirects]]
  from = "/thank-you"
  to = "/success.html"
  status = 200